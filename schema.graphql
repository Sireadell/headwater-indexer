type Agent {
  # ERC-8004 agentId
  id: ID!
  owner: String!
  agentURI: String!
  registeredAtBlock: Int!
  registeredAtTimestamp: Int!
  feedbacks: [Feedback!]! @derivedFrom(field: "agent")
}

type Reviewer {
  # wallet address that has given feedback and/or moved AUSD
  id: ID!
  feedbacksGiven: [Feedback!]! @derivedFrom(field: "reviewer")
  fundingReceived: [FundingTransfer!]! @derivedFrom(field: "to")
  fundingSent: [FundingTransfer!]! @derivedFrom(field: "from")
  # Maintained incrementally in the NewFeedback handler, not recomputed by
  # a script scan. Grows as real feedback events arrive across full chain
  # history, unbounded by any lookback window.
  distinctAgentIds: [String!]!
  distinctAgentCount: Int!
}

type Feedback {
  # agentId-reviewerAddress-feedbackIndex
  id: ID!
  agent: Agent!
  reviewer: Reviewer!
  feedbackIndex: BigInt!
  value: BigInt!
  valueDecimals: Int!
  tag1: String!
  tag2: String!
  revoked: Boolean!
  blockNumber: Int!
  timestamp: Int!
  txHash: String!
}

type FundingTransfer {
  # txHash-logIndex
  id: ID!
  from: Reviewer!
  to: Reviewer!
  value: BigInt!
  blockNumber: Int!
  timestamp: Int!
  txHash: String!
}

# The derived/aggregated entity this indexer exists for: a reviewer wallet
# that has reviewed more than one agent. Computed live, incrementally, at
# index time from real NewFeedback events across ALL of Monad's history,
# not scanned on demand across a bounded set of agents the way
# headwater/src/crossAgentReviewOverlap.js currently has to. Only created
# once a reviewer's SECOND distinct agent shows up, so its mere existence
# is itself the finding.
type CrossAgentOverlap {
  id: ID! # reviewer address
  reviewer: Reviewer!
  agentIds: [String!]!
  agentCount: Int!
}

type WalletLabel {
  # address
  id: ID!
  address: String!
  nansen_label: String
  nansen_category: String
  nansen_risk_score: Int
  nansen_checked_at: Int!
  # agreement with our signals
  has_signal_flag: Boolean!
  agreement_status: String!
}

# Marker edge, one row per (from,to) pair that has EVER transferred AUSD.
# Lets circular-funding detection be an O(1) lookup instead of a rescan:
# when X sends to Y, check whether an edge Y-to-X already exists.
type DirectedFundingEdge {
  id: ID! # "from-to", lowercased addresses
  from: String!
  to: String!
  firstTxHash: String!
  transferCount: Int!
}

# Ported from headwater/src/core/signals/circularFunding.js: wallet A funds
# wallet B, and B has independently sent AUSD back to A. Strongest
# deterministic signal in Headwater's original detection set, now computed
# live at index time across full chain history instead of a bounded
# per-request RPC scan.
type CircularFunding {
  id: ID! # sorted "walletA-walletB" so the pair is symmetric
  walletA: String!
  walletB: String!
  firstDirectionTxHash: String!
  returnTxHash: String!
  detectedAtBlock: Int!
  detectedAtTimestamp: Int!
}

# Ported from headwater/src/core/signals/fanOut.js: a funder that pays out
# to >=15 distinct recipients over >=25 hours looks like an
# exchange/payment-processor, not a coordinated funder. Same thresholds as
# the original signal (FAN_OUT_THRESHOLD=15, MIN_FAN_OUT_SPAN_SECONDS=25h).
# Circumstantial only -- never sufficient alone to call something risky,
# same constraint the original signal enforces.
type FunderFanOut {
  id: ID! # funder address
  funder: String!
  recipients: [String!]!
  recipientCount: Int!
  firstPaymentTimestamp: Int!
  lastPaymentTimestamp: Int!
  spanSeconds: Int!
  thresholdMet: Boolean!
}

# Review-timing cadence, measured per reviewer PER AGENT.
#
# A human writing genuine reviews leaves ragged gaps between them:
# minutes, then hours, then days. A script on a loop leaves near-identical
# gaps. This measures that raggedness via the coefficient of variation
# (standard deviation / mean) of the gaps between consecutive reviews.
#
# Scoped to one agent deliberately. Measured across a wallet's whole
# history instead, a scripted burst on one agent is separated from the
# next burst by a long pause while the operator moves on, and those
# pauses swamp the regularity inside each burst. Checked against live
# data: one wallet scored 0.16 on a single agent, which flags, but 1.73
# across all six agents it reviewed, which does not. The fraud is "this
# wallet worked through this agent on a timer", so that is the scope.
#
# Running totals keep this O(1) per event -- no timestamp array grows
# without bound, and nothing needs a rescan.
type ReviewCadence {
  id: ID! # agentId-reviewerAddress
  agent: Agent!
  reviewer: Reviewer!
  lastReviewTimestamp: Int!
  reviewCount: Int!
  intervalCount: Int!
  intervalSumSeconds: Float!
  intervalSumSquares: Float!
  meanIntervalSeconds: Float!
  stdDevSeconds: Float!
  coefficientOfVariation: Float!
  minIntervalSeconds: Int!
  maxIntervalSeconds: Int!
  # The most recent intervals, bounded, so a scripted burst can be seen
  # even when the wallet's full stream on this agent is ragged overall.
  # Observed live: one wallet posted 10 reviews at ~60s gaps, paused 54
  # minutes, then posted 9 more at irregular gaps. Whole-stream CV hid
  # the burst entirely. The fraud is "a scripted run happened", not
  # "every review was scripted".
  recentIntervals: [Int!]!
  # Latches true the first time any window of recent intervals is tight
  # enough to be implausible for a human, and never unsets: later ragged
  # reviews do not un-happen an earlier scripted run.
  burstDetected: Boolean!
  # Whole-stream verdict OR a detected burst.
  automationSuspected: Boolean!
}

# One wallet quietly funding several different reviewers.
#
# This is the gap the other two funding signals leave open. Circular
# funding needs money flowing back the other way. Fan-out only fires at
# 15+ recipients, and exists to recognise exchanges so they can be
# excluded. Neither catches the ordinary case: one wallet funds three
# reviewers, who then review the same agent.
#
# Exchanges do pay reviewers, incidentally, among thousands of others.
# Rather than depend on an external label service, this uses the
# indexer's own fan-out result as the exclusion: a funder already shaped
# like an exchange is recorded but not flagged.
type SharedFunder {
  id: ID! # funder address
  funder: String!
  fundedReviewers: [String!]!
  fundedReviewerCount: Int!
  firstFundingTimestamp: Int!
  lastFundingTimestamp: Int!
  exchangeShaped: Boolean!
  thresholdMet: Boolean!
}

# When a reviewer wallet first appeared on chain at all.
#
# Wallets provisioned together by one operator tend to be born together,
# minutes apart, then held until needed. Independent reviewers have no
# reason to share a birthday, so a cluster of reviewers on one agent all
# created in the same short window is hard to explain innocently.
#
# This entity records only the fact per wallet. Whether a given agent's
# reviewers cluster is decided at read time against that agent's own
# reviewer set, since the same wallet can sit in a tight cluster for one
# agent and a loose spread for another.
#
# firstSeenBlock 0 with foundActivity false means the lookup genuinely
# found nothing, kept distinct from a wallet truly born at block zero --
# otherwise every unknown wallet would look like the oldest on the chain
# and cluster falsely with all the others.
type WalletBirth {
  id: ID! # wallet address
  wallet: String!
  firstSeenBlock: Int!
  firstSeenTimestamp: Int!
  foundActivity: Boolean!
}


# Who paid into a wallet. One row per (wallet, funder) pair.
#
# This is the edge that shows apparently separate actors sharing an
# origin. Two agents owned by different wallets look independent until
# both owner wallets trace back to the same payer.
#
# `isDust` marks native transfers below 0.01, which are gas top-ups
# rather than real capitalisation. Carried over from telegraph-sentinel:
# collapsing to a single earliest funder there let a trivial gas top-up
# mask whoever actually funded the wallet, so every funder is kept and
# marked instead of picking one winner.
#
# `source` is "native" or "ausd". Both are needed because an ERC-20
# transfer's transaction `to` is the token contract, not the recipient,
# so token funding is invisible to a native-transaction scan. That was a
# live-caught bug in the earlier project, not a theoretical one.
type WalletFunder {
  id: ID! # wallet-funder
  wallet: String!
  funder: String!
  firstFundedBlock: Int!
  firstFundedTimestamp: Int!
  valueRaw: String!
  source: String!
  isDust: Boolean!
}

# How many distinct wallets a funder has paid, natively.
#
# Needed because dust filtering is not sufficient on its own. Measured
# against live Monad data, a single wallet had funded 1,984 reviewer
# wallets with ordinary non-dust amounts, accounting for 99% of every
# funding relationship in the index. It is a faucet or distributor, not
# an operator. Grouping by shared funder without this would flag
# essentially every agent on the chain and make the signal worthless.
#
# This is the native-path equivalent of what FunderFanOut does for AUSD.
# FunderFanOut cannot cover it, because that distributor pays in native
# MON and never appears in AUSD data at all.
type FunderProfile {
  id: ID! # funder address
  funder: String!
  distinctWalletsFunded: Int!
  distributorShaped: Boolean!
}
