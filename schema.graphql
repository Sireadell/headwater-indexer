type Agent {
  # ERC-8004 agentId
  id: ID!
  owner: String!
  agentURI: String!
  registeredAtBlock: Int!
  registeredAtTimestamp: Int!
  feedbacks: [Feedback!]! @derivedFrom(field: "agent")
}

type Reviewer {
  # wallet address that has given feedback and/or moved AUSD
  id: ID!
  feedbacksGiven: [Feedback!]! @derivedFrom(field: "reviewer")
  fundingReceived: [FundingTransfer!]! @derivedFrom(field: "to")
  fundingSent: [FundingTransfer!]! @derivedFrom(field: "from")
  # Maintained incrementally in the NewFeedback handler, not recomputed by
  # a script scan. Grows as real feedback events arrive across full chain
  # history, unbounded by any lookback window.
  distinctAgentIds: [String!]!
  distinctAgentCount: Int!
}

type Feedback {
  # agentId-reviewerAddress-feedbackIndex
  id: ID!
  agent: Agent!
  reviewer: Reviewer!
  feedbackIndex: BigInt!
  value: BigInt!
  valueDecimals: Int!
  tag1: String!
  tag2: String!
  revoked: Boolean!
  blockNumber: Int!
  timestamp: Int!
  txHash: String!
}

type FundingTransfer {
  # txHash-logIndex
  id: ID!
  from: Reviewer!
  to: Reviewer!
  value: BigInt!
  blockNumber: Int!
  timestamp: Int!
  txHash: String!
}

# The derived/aggregated entity this indexer exists for: a reviewer wallet
# that has reviewed more than one agent. Computed live, incrementally, at
# index time from real NewFeedback events across ALL of Monad's history,
# not scanned on demand across a bounded set of agents the way
# headwater/src/crossAgentReviewOverlap.js currently has to. Only created
# once a reviewer's SECOND distinct agent shows up, so its mere existence
# is itself the finding.
type CrossAgentOverlap {
  id: ID! # reviewer address
  reviewer: Reviewer!
  agentIds: [String!]!
  agentCount: Int!
}

type WalletLabel {
  # address
  id: ID!
  address: String!
  nansen_label: String
  nansen_category: String
  nansen_risk_score: Int
  nansen_checked_at: Int!
  # agreement with our signals
  has_signal_flag: Boolean!
  agreement_status: String!
}

# Marker edge, one row per (from,to) pair that has EVER transferred AUSD.
# Lets circular-funding detection be an O(1) lookup instead of a rescan:
# when X sends to Y, check whether an edge Y-to-X already exists.
type DirectedFundingEdge {
  id: ID! # "from-to", lowercased addresses
  from: String!
  to: String!
  firstTxHash: String!
  transferCount: Int!
}

# Ported from headwater/src/core/signals/circularFunding.js: wallet A funds
# wallet B, and B has independently sent AUSD back to A. Strongest
# deterministic signal in Headwater's original detection set, now computed
# live at index time across full chain history instead of a bounded
# per-request RPC scan.
type CircularFunding {
  id: ID! # sorted "walletA-walletB" so the pair is symmetric
  walletA: String!
  walletB: String!
  firstDirectionTxHash: String!
  returnTxHash: String!
  detectedAtBlock: Int!
  detectedAtTimestamp: Int!
}

# Ported from headwater/src/core/signals/fanOut.js: a funder that pays out
# to >=15 distinct recipients over >=25 hours looks like an
# exchange/payment-processor, not a coordinated funder. Same thresholds as
# the original signal (FAN_OUT_THRESHOLD=15, MIN_FAN_OUT_SPAN_SECONDS=25h).
# Circumstantial only -- never sufficient alone to call something risky,
# same constraint the original signal enforces.
type FunderFanOut {
  id: ID! # funder address
  funder: String!
  recipients: [String!]!
  recipientCount: Int!
  firstPaymentTimestamp: Int!
  lastPaymentTimestamp: Int!
  spanSeconds: Int!
  thresholdMet: Boolean!
}

# Review-timing cadence. A human writing genuine reviews leaves ragged
# gaps between them: minutes, then hours, then days. A script on a loop
# leaves near-identical gaps. This measures that raggedness directly via
# the coefficient of variation (standard deviation / mean) of the gaps
# between a reviewer's consecutive feedback events.
#
# Low CV means the gaps barely vary, which is what automation looks like.
# Observed on a real flagged cluster: one wallet posted ten reviews spaced
# 48-82 seconds apart (CV 0.16), another 48-57 seconds apart (CV 0.06).
# Ordinary human review behaviour sits far above 1.0.
#
# Running totals are kept so this stays O(1) per event -- no timestamp
# array grows without bound, and nothing needs a rescan.
type ReviewCadence {
  id: ID! # reviewer address
  reviewer: Reviewer!
  lastReviewTimestamp: Int!
  reviewCount: Int!
  intervalCount: Int!
  intervalSumSeconds: Float!
  intervalSumSquares: Float!
  meanIntervalSeconds: Float!
  stdDevSeconds: Float!
  coefficientOfVariation: Float!
  minIntervalSeconds: Int!
  maxIntervalSeconds: Int!
  # True only once there are enough intervals to be meaningful AND the
  # gaps are tight enough to be implausible for a human.
  automationSuspected: Boolean!
}
